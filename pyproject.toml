[tool.ruff]
line-length = 125
target-version = "py313"
extend-exclude = ["*/migrations/*", "static", "staticfiles", "scripts/marca"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "C4", "SIM"]
ignore = ["DJ001", "DJ008", "DJ012", "E731", "SIM108", "B904"]

[tool.ruff.lint.per-file-ignores]
"apps/core/pwa.py" = ["E501"]   # código JavaScript del service worker dentro de un string

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
