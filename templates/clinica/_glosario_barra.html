<div class="os-glosario d-flex flex-wrap gap-2 align-items-end mb-3 p-2 rounded" data-glosario data-edad-meses="{{ edad_meses }}" data-url="{% url 'clinica:medicamento_calcular' 0 %}">
  {% if glosario %}
    <div class="flex-grow-1" style="min-width:200px">
      <label class="form-label small mb-0" for="glosario-med"><i class="bi bi-capsule me-1"></i>Del glosario</label>
      <select class="form-select form-select-sm" id="glosario-med">
        <option value="">Elige un medicamento…</option>
        {% for m in glosario %}<option value="{{ m.pk }}">{{ m.nombre }}{% if m.presentacion %} · {{ m.presentacion }}{% endif %}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="form-label small mb-0" for="glosario-nivel">Dosis</label>
      <select class="form-select form-select-sm" id="glosario-nivel">
        <option value="minimo">Mínima</option><option value="estandar" selected>Estándar</option><option value="maximo">Máxima</option>
      </select>
    </div>
    <div style="width:90px">
      <label class="form-label small mb-0" for="glosario-peso">Peso (kg)</label>
      <input type="text" inputmode="decimal" class="form-control form-control-sm" id="glosario-peso">
    </div>
    <button type="button" class="btn btn-sm btn-outline-primary" data-glosario-agregar><i class="bi bi-plus-lg me-1"></i>Agregar al récipe</button>
    <div class="w-100 small" data-glosario-msg aria-live="polite"></div>
  {% else %}
    <span class="small text-muted"><i class="bi bi-capsule me-1"></i>Carga tus medicamentos frecuentes en el <a href="{% url 'clinica:medicamentos' %}" target="_blank">glosario</a> y aquí calcularás la dosis por peso o edad.</span>
  {% endif %}
</div>
